services:
  - type: web
    name: web-modeos-el-obi
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_BOT_TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_BOTS_JSON
        sync: false
      - key: DISCORD_DEV_USER_ID
        sync: false
      - key: DISCORD_ANNOUNCEMENTS_CHANNEL_ID
        sync: false
      - key: DISCORD_STATUS_CHANNEL_ID
        sync: false
      - key: DISCORD_LIVE_CHANNEL_ID
        sync: false
      - key: DISCORD_EVENTS_WEBHOOK_SECRET
        generateValue: true
      - key: DEV_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
